<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>English Writing Assessment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
  <section id="loginView" class="card">
    <h1>English Writing Assessment</h1>
    <p>Enter your Student ID and Access Code.</p>
    <label>Student ID<input id="studentId" autocomplete="off"></label>
    <label>Access Code<input id="accessCode" type="password" autocomplete="off"></label>
    <button id="startBtn">Start Assessment</button>
    <p id="loginMsg" class="message"></p>
  </section>

  <section id="examView" class="hidden">
    <div class="topbar">
      <div>
        <h1 id="assessmentTitle">Assessment</h1>
        <div id="studentInfo"></div>
      </div>
      <div class="timer" id="timer">--:--</div>
    </div>
    <div id="questions"></div>
    <button id="submitBtn" class="submit">Submit Assessment</button>
    <p id="examMsg" class="message"></p>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/security.js"></script>
<script src="js/app.js"></script>
</body>
</html>
